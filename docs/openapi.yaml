openapi: 3.0.3
info:
  title: LMS API
  version: 1.0.0
  description: |
    Contract for the LMS web (React) and mobile (Flutter) apps.
    Every response is `{ success: true, data, pagination? }` or `{ success: false, error, code? }`.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Mobile:
      type: string
      description: Indian mobile number; the API normalizes to +91XXXXXXXXXX
      minLength: 10
      maxLength: 16
    Otp: { type: string, pattern: '^\d{6}$' }
    Status: { type: string, enum: [pending, approved, rejected, blocked] }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error: { type: string }
        code: { type: string }
    VideoInput:
      type: object
      properties:
        source: { type: string, enum: [upload, youtube, vimeo, bunny] }
        url: { type: string, maxLength: 500 }
        fileKey: { type: string, maxLength: 200 }
    CourseInput:
      type: object
      required: [title, description, subject, language]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        subject: { type: string, maxLength: 120 }
        language: { type: string }
        thumbnailKey: { type: string, nullable: true }
        durationText: { type: string, nullable: true }
        feeDisplay: { type: string, nullable: true, description: Display only. No payments. }
        demoVideo1: { type: object, nullable: true }
        demoVideo2: { type: object, nullable: true }
    NamedInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
    ContentInput:
      type: object
      required: [title, type]
      properties:
        title: { type: string, maxLength: 200 }
        type: { type: string, enum: [video, pdf, link, live] }
        videoSource: { type: string, nullable: true }
        fileKey: { type: string, nullable: true }
        url: { type: string, nullable: true }
        isFreePreview: { type: boolean, description: Always false for live lessons }
        startsAt: { type: string, format: date-time, description: Live lessons only (required) }
        durationMin: { type: integer, minimum: 5, maximum: 600, description: Live lessons only (default 60) }
        meetLink: { type: string, nullable: true, description: Live lessons only. Empty means create one automatically }
        batchId: { type: integer, nullable: true, description: Live lessons only. Empty means every batch }
    BatchInput:
      type: object
      required: [name, startDate]
      properties:
        name: { type: string, maxLength: 80 }
        startDate: { type: string }
        endDate: { type: string, nullable: true }
        timingText: { type: string, nullable: true }
        maxStudents: { type: integer, minimum: 1, nullable: true }
        status: { type: string, enum: [active, closed] }
    QuestionInput:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [mcq, true_false, fill_blank, multi_correct] }
        text: { type: string }
        difficulty: { type: string, enum: [easy, medium, hard] }
        marks: { type: number }
        negativeMarks: { type: number }
        explanation: { type: string, nullable: true }
        explanationImageKey: { type: string, nullable: true, description: "Photo of the worked solution. Upload first with POST /uploads kind=solution, then pass the returned key. Responses also carry explanationImageUrl (signed)." }
        options:
          type: array
          items: { type: object, properties: { text: { type: string }, isCorrect: { type: boolean } } }
        acceptedAnswers: { type: array, items: { type: string } }
    ExamInput:
      type: object
      required: [title, scope, mode, selection, category]
      properties:
        title: { type: string, maxLength: 200 }
        scope: { type: string, enum: [module, modules, course] }
        moduleIds: { type: array, items: { type: integer } }
        mode: { type: string, enum: [practice, mock] }
        selection: { type: string, enum: [manual, random] }
        questionIds: { type: array, items: { type: integer } }
        randomMix:
          type: array
          items: { type: object, properties: { moduleId: { type: integer }, easy: { type: integer }, medium: { type: integer }, hard: { type: integer } } }
        category: { type: string, enum: [unit_test_1, unit_test_2, final, practice] }
        weightage: { type: number }
        totalMarks: { type: number, nullable: true }
        negativeMarking: { type: boolean }
        timeLimitMin: { type: integer, nullable: true }
        passingPct: { type: number, nullable: true }
        shuffleQuestions: { type: boolean }
        shuffleOptions: { type: boolean }
        attemptLimit: { type: integer, nullable: true }
        startsAt: { type: string, nullable: true }
        endsAt: { type: string, nullable: true }
        batchIds: { type: array, items: { type: integer } }
    LiveClassInput:
      type: object
      required: [courseId, topic, startsAt]
      properties:
        courseId: { type: integer }
        batchId: { type: integer, nullable: true, description: Empty means every batch }
        topic: { type: string, maxLength: 200 }
        startsAt: { type: string }
        durationMin: { type: integer, minimum: 5, maximum: 600 }
        meetLink: { type: string, nullable: true }
        status: { type: string, enum: [scheduled, live, completed, cancelled] }
    ProgramInput:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, maxLength: 200 }
        startsAt: { type: string }
        courseId: { type: integer, nullable: true }
        batchId: { type: integer, nullable: true }
    RecordingInput:
      type: object
      required: [videoSource]
      properties:
        videoSource: { type: string, enum: [upload, youtube, vimeo, bunny] }
        fileKey: { type: string, nullable: true, description: Required when videoSource is upload }
        url: { type: string, nullable: true, description: Required for youtube / vimeo / bunny }
    LiveLessonInfo:
      type: object
      description: Present on contents of type live
      properties:
        liveClassId: { type: integer }
        startsAt: { type: string, format: date-time }
        durationMin: { type: integer }
        batch: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
        stage: { type: string, enum: [upcoming, live, ended, recorded, cancelled] }
        meetLink: { type: string, nullable: true, description: Teacher always; student only while upcoming or live }
    RecordingInfo:
      type: object
      nullable: true
      properties:
        videoSource: { type: string, enum: [upload, youtube, vimeo, bunny] }
        url: { type: string, nullable: true }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
  parameters:
    CourseId: { name: courseId, in: path, required: true, schema: { type: integer } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
paths:
  /health:
    get:
      tags: [system]
      summary: Health check (API + database)
      responses:
        '200': { description: OK }
        '503': { description: Database unavailable }
  /auth/otp/send:
    post:
      tags: [auth]
      summary: Send a one-time password (same response for known and unknown numbers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, purpose]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                purpose: { type: string, enum: [login, teacher_register, student_register, demo_request, delete_account] }
      responses:
        '200': { description: '{ sent, resendAfterSec }' }
        '429': { description: Too many OTP requests }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with mobile + OTP. Web gets an HttpOnly refresh cookie; X-Client mobile gets refreshToken in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mobile, otp]
              properties:
                mobile: { $ref: '#/components/schemas/Mobile' }
                otp: { $ref: '#/components/schemas/Otp' }
                deviceId: { type: string, maxLength: 64 }
      responses:
        '200': { description: '{ accessToken, user, refreshToken? }' }
        '403': { description: Blocked / request pending / request rejected }
        '404': { description: No account for this mobile }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token (HttpOnly cookie, or JSON body { refreshToken } from the mobile app). Reuse of a rotated token logs out every session.
      responses:
        '200': { description: '{ accessToken, refreshToken? }' }
        '401': { description: Session ended }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session (cookie, or JSON body { refreshToken } from the mobile app)
      responses:
        '200': { description: Logged out }
  /auth/me:
    get:
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The signed-in user and their profile }
  /teacher-requests:
    post:
      tags: [public]
      summary: Become a Teacher (multipart; validated in the route)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, mobile, otp, courseName, subject, experienceYears, acceptTerms]
              properties:
                name: { type: string, maxLength: 120 }
                mobile: { type: string }
                otp: { type: string }
                courseName: { type: string, maxLength: 200 }
                subject: { type: string, maxLength: 120 }
                experienceYears: { type: integer, minimum: 0, maximum: 60 }
                email: { type: string }
                city: { type: string }
                qualification: { type: string }
                acceptTerms: { type: boolean }
                whatsappOptIn: { type: boolean }
                photo: { type: string, format: binary }
                idDocument: { type: string, format: binary }
      responses:
        '201': { description: '{ requestId, status: pending }' }
        '409': { description: Already pending / already registered }
  /account/change-mobile/start:
    post:
      tags: [account]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [newMobile], properties: { newMobile: { $ref: '#/components/schemas/Mobile' } } }
      responses:
        '200': { description: OTP sent to the new number }
        '409': { description: Number already registered }
  /account/change-mobile/confirm:
    post:
      tags: [account]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newMobile, otp]
              properties:
                newMobile: { $ref: '#/components/schemas/Mobile' }
                otp: { $ref: '#/components/schemas/Otp' }
                refreshToken: { type: string }
      responses:
        '200': { description: Mobile changed; other sessions revoked }
  /account/delete:
    post:
      tags: [account]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [otp], properties: { otp: { $ref: '#/components/schemas/Otp' } } }
      responses:
        '200': { description: Account anonymised and closed }
        '409': { description: Teacher with students / admin account }
  /public/legal/{doc}:
    get:
      tags: [public]
      parameters:
        - { name: doc, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string, enum: [en, mr, hi] } }
      responses:
        '200': { description: '{ doc, version, markdown, support }' }
  /public/config:
    get:
      tags: [public]
      responses:
        '200': { description: '{ supportContact, policyVersion }' }
  /admin/teacher-requests:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Paginated teacher requests }
  /admin/teacher-requests/{id}/accept:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Accepted; teacher account created }
        '409': { description: Not pending }
  /admin/teacher-requests/{id}/reject:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        '200': { description: Rejected }
  /admin/users/{publicId}/change-mobile:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newMobile]
              properties:
                newMobile: { $ref: '#/components/schemas/Mobile' }
                reason: { type: string }
      responses:
        '200': { description: Mobile changed (audited) }
  /admin/dashboard:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: '{ pendingRequests, activeTeachers, blockedTeachers, totalStudents, expiringSubscriptions7d }' }
  /admin/teachers:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [approved, blocked] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Rows of { publicId, name, mobile, subject, status, joinedAt, studentCount }' }
  /admin/teachers/{publicId}:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Teacher detail with subscriptions }
        '404': { description: Not found }
  /admin/teachers/{publicId}/block:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: Blocked; sessions revoked; audited }
        '409': { description: Already blocked }
  /admin/teachers/{publicId}/activate:
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: publicId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Activated; audited }
  /admin/subscriptions:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: teacher, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, upcoming, expired, blocked] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: Subscriptions with computed status and student count }
    post:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teacherPublicId, planType, startDate]
              properties:
                teacherPublicId: { type: string, format: uuid }
                planType: { type: string, enum: [monthly, quarterly, half_yearly, yearly, custom] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: Required for custom }
      responses:
        '201': { description: Created }
        '409': { description: Overlaps another subscription }
  /admin/subscriptions/{id}:
    put:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planType, startDate]
              properties:
                planType: { type: string, enum: [monthly, quarterly, half_yearly, yearly, custom] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                blocked: { type: boolean }
      responses:
        '200': { description: Updated; audited }
  /admin/audit-log:
    get:
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string, maxLength: 40 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'Audit rows, newest first' }
  /notifications:
    get:
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: The caller's notifications }
  /notifications/read-all:
    post:
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All marked read }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Marked read }
        '404': { description: Not the caller's notification }
  /teacher/courses:
    get:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "The teacher's own courses" }
    post:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      summary: Create a draft course. Thumbnail and the 2 demo videos can be added later; publishing needs them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '201': { description: Draft created }
  /teacher/courses/{courseId}:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Course + readiness { ready, missing[] }' }
        '404': { description: "Not found or not the teacher's" }
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseInput' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted (drafts only) }
        '409': { description: Published or has students }
  /teacher/courses/{courseId}/status:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses:
        '200': { description: Status changed }
        '403': { description: Teacher subscription expired (limited mode) }
        '422': { description: 'Not ready; details.missing lists what to finish' }
  /teacher/courses/{courseId}/curriculum:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    get:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'Subjects, modules and contents (own files as signed URLs)' }
  /teacher/courses/{courseId}/subjects:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    post:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '201': { description: Subject created }
  /teacher/courses/{courseId}/subjects/order:
    parameters: [{ $ref: '#/components/parameters/CourseId' }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [subjectIds], properties: { subjectIds: { type: array, items: { type: integer } } } }
      responses:
        '200': { description: Reordered }
  /teacher/subjects/{subjectId}:
    parameters: [{ name: subjectId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '409': { description: Has modules }
  /teacher/subjects/{subjectId}/modules:
    parameters: [{ name: subjectId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '201': { description: Module created with the next order number }
  /teacher/subjects/{subjectId}/modules/order:
    parameters: [{ name: subjectId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [moduleIds], properties: { moduleIds: { type: array, items: { type: integer } } } }
      responses:
        '200': { description: Reordered }
        '400': { description: "The list is not exactly the subject's modules" }
  /teacher/modules/{moduleId}:
    parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '409': { description: Has content or questions }
  /teacher/modules/{moduleId}/contents:
    parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '201': { description: Content created }
  /teacher/modules/{moduleId}/contents/order:
    parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [contentIds], properties: { contentIds: { type: array, items: { type: integer } } } }
      responses:
        '200': { description: Reordered }
  /teacher/contents/{contentId}:
    parameters: [{ name: contentId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentInput' }
      responses:
        '200': { description: Updated }
    delete:
      tags: [teacher-content]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deleted }
