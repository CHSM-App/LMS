  /teacher/courses/{courseId}/duplicate:
    parameters: [{ name: courseId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [teacher-content]
      summary: Copy the course as a new draft (subjects, modules, lessons; live lessons without dates; no batches or students)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: The new draft course }
        '404': { description: Not your course }
