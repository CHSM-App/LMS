  /teacher/contents/{contentId}/recording:
    parameters: [{ name: contentId, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [teacher-content]
      summary: Add or replace the recording of a live lesson
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordingInput' }
      responses:
        '200': { description: The live lesson with its recording }
        '400': { description: Invalid source, file key or link }
        '404': { description: Not your content }
        '409': { description: NOT_LIVE_LESSON }
    delete:
      tags: [teacher-content]
      summary: Remove the recording of a live lesson
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The live lesson without a recording }
        '404': { description: Not your content }
        '409': { description: NOT_LIVE_LESSON }
