  /teacher/contents/{contentId}/sessions:
    parameters: [{ name: contentId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [teacher-content]
      summary: Schedule one more batch on an existing live lesson (a new session of the same lesson)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveSessionInput' }
      responses:
        '201': { description: The new session, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } } }
        '400': { description: Invalid time, batch or Meet link }
        '404': { description: Not your content }
        '409': { description: SESSION_EXISTS or SLOT_ALL_BATCHES or BATCH_CLOSED or NOT_LIVE_LESSON }
  /teacher/courses/{courseId}/batches/{batchId}/live-schedule:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: integer } }
      - { name: batchId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [teacher-content]
      summary: Every live lesson of the course with this batch's session, or null when not scheduled yet
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The live lessons and this batch's session for each }
        '404': { description: Not your course or batch }
    post:
      tags: [teacher-content]
      summary: Schedule many live lessons for one batch in one go (all or nothing)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiveScheduleInput' }
      responses:
        '201': { description: The created sessions }
        '400': { description: Invalid item }
        '404': { description: Not your course or batch }
        '409': { description: SESSION_EXISTS or SLOT_ALL_BATCHES or BATCH_CLOSED }
